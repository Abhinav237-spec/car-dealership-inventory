# Render Blueprint: one click creates the API and its Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: dealership-db
    plan: free
    databaseName: dealership

services:
  - type: web
    name: dealership-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev because the TypeScript compiler is a devDependency.
    buildCommand: npm install --include=dev && npm run build
    # Migrations also run automatically at boot (see src/server.ts).
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealership-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@dealership.test
      - key: ADMIN_PASSWORD
        sync: false # you type this in the dashboard; never commit it
